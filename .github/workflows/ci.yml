name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: The packed CLI runs from a clean folder
        shell: bash
        run: |
          set -euo pipefail
          npm pack --silent
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/inferit-seller-*.tgz
          npx inferit-seller --version
          npx inferit-seller --help
          INFERIT_SELLER_HOME="$RUNNER_TEMP/home" npx inferit-seller status
          # No token and no local server on the runner: doctor reports both and exits 1.
          set +e
          INFERIT_SELLER_HOME="$RUNNER_TEMP/home" npx inferit-seller doctor
          code=$?
          set -e
          test "$code" = "1"
          INFERIT_SELLER_HOME="$RUNNER_TEMP/home" npx inferit-seller install-service --dry-run || true

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: inferit-seller:ci
      - name: The image answers --version and doctor
        run: |
          docker run --rm inferit-seller:ci --version
          docker run --rm inferit-seller:ci doctor || test $? = 1
